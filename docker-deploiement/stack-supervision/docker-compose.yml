services:
  grafana:
    image: grafana/grafana:11.2.0
    container_name: portfolio-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: portfolio-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD in your environment}
      MYSQL_DATABASE: inventaire
      MYSQL_USER: inventaire_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD in your environment}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  adminer:
    image: adminer:4.8.1
    container_name: portfolio-adminer
    ports:
      - "8081:8080"
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  grafana_data:
  mysql_data:
